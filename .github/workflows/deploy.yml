name: Deploy Conversation Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The original v2.8.15 source archive has no package-lock.json.
      # Use npm install instead of npm ci unless a lockfile is subsequently committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
